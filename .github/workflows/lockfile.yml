name: Lockfile

# When a branch changes package.json, write package-lock.json for it and commit
# it back, so `npm ci` in CI installs exactly what the branch asked for.
on:
  push:
    branches-ignore: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the lockfile if it changed
        run: |
          if git diff --quiet package-lock.json; then echo "Lockfile already matches."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock.json with package.json"
          git push
