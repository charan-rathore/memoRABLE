<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1010" role="img" aria-labelledby="title desc"><title id="title">memoRABLE: document to inspectable memory</title><desc id="desc">PDF text joins local import. Strict JSON bypasses prose understanding. The canonical memory document renders Email, Web and Document independently. Docling and AI are separate optional refinements.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#77746A"/></marker></defs><rect width="1100" height="1010" fill="#FAF9F5"/><g font-family="system-ui,sans-serif"><text x="36" y="46" font-size="30" fill="#14130F" font-weight="600">memoRABLE / document to memory</text><text x="36" y="75" font-size="15" fill="#54534B" font-weight="400">Code map at 59a098f · local by default · optional services shown separately</text><g><rect x="36" y="122" width="310" height="86" rx="8" fill="white" stroke="#D9D5C8"/><text x="52" y="146" font-size="12" fill="#1E3BD6" font-weight="600">01</text><text x="52" y="171" font-size="18" fill="#14130F" font-weight="600">Bring a document</text><text x="52" y="193" font-size="13" fill="#54534B" font-weight="400">Drop / paste / examples</text></g><g><rect x="395" y="122" width="310" height="86" rx="8" fill="white" stroke="#D9D5C8"/><text x="411" y="146" font-size="12" fill="#1E3BD6" font-weight="600">02 / PDF ONLY</text><text x="411" y="171" font-size="18" fill="#14130F" font-weight="600">Read layout + image OCR</text><text x="411" y="193" font-size="13" fill="#54534B" font-weight="400">pdf.js · first 40 pages</text></g><g><rect x="754" y="122" width="310" height="86" rx="8" fill="white" stroke="#D9D5C8"/><text x="770" y="146" font-size="12" fill="#1E3BD6" font-weight="600">03</text><text x="770" y="171" font-size="18" fill="#14130F" font-weight="600">Preflight + format route</text><text x="770" y="193" font-size="13" fill="#54534B" font-weight="400">JSON or text, never both</text></g><path d="M346 165 H393" fill="none" stroke="#77746A" stroke-width="1.5" marker-end="url(#a)"/><path d="M705 165 H752" fill="none" stroke="#77746A" stroke-width="1.5" marker-end="url(#a)"/><path d="M191 208 V235 H909 V210" fill="none" stroke="#77746A" stroke-width="1.5" marker-end="url(#a)"/><text x="355" y="255" font-size="12" fill="#54534B" font-weight="400">JSON / Markdown / text bypass the PDF reader</text><g><rect x="754" y="308" width="310" height="86" rx="8" fill="white" stroke="#D9D5C8"/><text x="770" y="332" font-size="12" fill="#1E3BD6" font-weight="600">04 / TEXT ONLY</text><text x="770" y="357" font-size="18" fill="#14130F" font-weight="600">Hybrid segmentation</text><text x="770" y="379" font-size="13" fill="#54534B" font-weight="400">Sections + semantic boundaries</text></g><g><rect x="395" y="308" width="310" height="86" rx="8" fill="white" stroke="#D9D5C8"/><text x="411" y="332" font-size="12" fill="#1E3BD6" font-weight="600">05 / TEXT ONLY</text><text x="411" y="357" font-size="18" fill="#14130F" font-weight="600">Universal understanding</text><text x="411" y="379" font-size="13" fill="#54534B" font-weight="400">Observations + structural authority</text></g><g><rect x="36" y="308" width="310" height="86" rx="8" fill="white" stroke="#D9D5C8"/><text x="52" y="332" font-size="12" fill="#1E3BD6" font-weight="600">06 / TEXT ONLY</text><text x="52" y="357" font-size="18" fill="#14130F" font-weight="600">Adaptive projection</text><text x="52" y="379" font-size="13" fill="#54534B" font-weight="400">Specialized or Generic Knowledge</text></g><path d="M909 208 V306" fill="none" stroke="#77746A" stroke-width="1.5" marker-end="url(#a)"/><path d="M754 351 H707" fill="none" stroke="#77746A" stroke-width="1.5" marker-end="url(#a)"/><path d="M395 351 H348" fill="none" stroke="#77746A" stroke-width="1.5" marker-end="url(#a)"/><g><rect x="36" y="502" width="310" height="86" rx="8" fill="white" stroke="#D9D5C8"/><text x="52" y="526" font-size="12" fill="#1E3BD6" font-weight="600">07</text><text x="52" y="551" font-size="18" fill="#14130F" font-weight="600">Canonical memory</text><text x="52" y="573" font-size="13" fill="#54534B" font-weight="400">IDs / provenance / reducer state</text></g><g><rect x="395" y="502" width="310" height="86" rx="8" fill="white" stroke="#D9D5C8"/><text x="411" y="526" font-size="12" fill="#1E3BD6" font-weight="600">08</text><text x="411" y="551" font-size="18" fill="#14130F" font-weight="600">Elements rendering</text><text x="411" y="573" font-size="13" fill="#54534B" font-weight="400">Each mode succeeds or fails alone</text></g><g><rect x="754" y="502" width="310" height="86" rx="8" fill="white" stroke="#D9D5C8"/><text x="770" y="526" font-size="12" fill="#1E3BD6" font-weight="600">09</text><text x="770" y="551" font-size="18" fill="#14130F" font-weight="600">Inspect and export</text><text x="770" y="573" font-size="13" fill="#54534B" font-weight="400">Email / Web / Document</text></g><path d="M191 394 V500" fill="none" stroke="#77746A" stroke-width="1.5" marker-end="url(#a)"/><path d="M346 545 H393" fill="none" stroke="#77746A" stroke-width="1.5" marker-end="url(#a)"/><path d="M705 545 H752" fill="none" stroke="#77746A" stroke-width="1.5" marker-end="url(#a)"/><path d="M1064 165 H1080 V461 H191 V500" fill="none" stroke="#77746A" stroke-width="1.5" marker-end="url(#a)"/><text x="529" y="450" font-size="13" fill="#54534B" font-weight="400">strict JSON bypasses text understanding</text><rect x="36" y="657" width="1028" height="190" rx="10" fill="white" stroke="#D9D5C8" stroke-dasharray="5 4"/><text x="56" y="686" font-size="13" fill="#1E3BD6" font-weight="600">OPTIONAL ROUTES / not required for the local pipeline</text><text x="56" y="724" font-size="17" fill="#14130F" font-weight="600">A / Docling: PDF → sidecar → candidate text → re-import if better</text><text x="56" y="749" font-size="14" fill="#54534B" font-weight="400">Flag + selective heuristic; never delays the first local PDF result.</text><text x="56" y="789" font-size="17" fill="#14130F" font-weight="600">B / AI: source + candidate → chat endpoint → schema / repair → candidate</text><text x="56" y="814" font-size="14" fill="#54534B" font-weight="400">Explicit action, off by default; failures retain local memory. Scores are not factual verification.</text><path d="M191 657 V590" fill="none" stroke="#77746A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="213" y="628" font-size="12" fill="#54534B" font-weight="400">accepted candidate only</text><text x="36" y="902" font-size="13" fill="#1E3BD6" font-weight="600">BOUNDARIES TO KEEP VISIBLE</text><text x="36" y="932" font-size="15" fill="#54534B" font-weight="400">Optional routes can send source content off the browser. A saved reference is not a full-document backup.</text><text x="36" y="961" font-size="15" fill="#54534B" font-weight="400">A source locator is inspectable evidence, not proof that an AI claim is entailed. Export is not sending.</text></g></svg>